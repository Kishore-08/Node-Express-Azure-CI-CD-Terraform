trigger:
- main

pr:
- main

variables:
  terraformVersion: '1.6.6'
  workingDirectory: 'terraform'
  serviceConnection: 'azure-conn-terraform'   # optional, only for AzureCLI login
  # The following should be defined in Pipeline Variables as secrets
  # ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_SUBSCRIPTION_ID, ARM_TENANT_ID

pool:
  vmImage: 'ubuntu-latest'

stages:

# =====================================================
# STAGE 1 — TERRAFORM PLAN (CI)
# =====================================================
- stage: Terraform_Plan
  displayName: "Terraform Plan"
  jobs:
  - job: Plan
    displayName: "Run Terraform Plan"
    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)
      
    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          echo "Logging in to Azure using SP..."
          az login --service-principal \
            -u $ARM_CLIENT_ID \
            -p $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID
          az account set --subscription $ARM_SUBSCRIPTION_ID

          echo "Initializing Terraform..."
          terraform init
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    # Terraform Validate
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          echo "Logging in to Azure using SP..."
          az login --service-principal \
            -u $ARM_CLIENT_ID \
            -p $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID
          az account set --subscription $ARM_SUBSCRIPTION_ID

          echo "Initializing Terraform..."
          terraform validate
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
    
    # Terraform Plan
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          echo "Logging in to Azure using SP..."
          az login --service-principal \
            -u $ARM_CLIENT_ID \
            -p $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID
          az account set --subscription $ARM_SUBSCRIPTION_ID

          echo "Initializing Terraform..."
          terraform plan -out=tfplan
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    # Publish plan artifact
    - task: PublishPipelineArtifact@1
      displayName: "Publish tfplan"
      inputs:
        targetPath: '$(workingDirectory)/tfplan'
        artifact: 'tfplan'

# =====================================================
# STAGE 2 — TERRAFORM APPLY (CD)
# =====================================================
- stage: Terraform_Apply
  displayName: "Terraform Apply"
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: "Run Terraform Apply"
    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    # Download plan artifact
    - task: DownloadPipelineArtifact@2
      displayName: "Download tfplan"
      inputs:
        artifact: tfplan
        path: $(workingDirectory)

    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          echo "Initializing Terraform..."
          terraform init
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    # Terraform Apply
    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          echo "Applying Terraform plan..."
          terraform apply -auto-approve tfplan
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)