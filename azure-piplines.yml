trigger:
- main

pr:
- main

variables:
  terraformVersion: '1.5.7'
  workingDirectory: 'terraform'
  serviceConnection: 'azure-conn-terraform'   # your service connection name

pool:
  vmImage: 'ubuntu-latest'

stages:

# =====================================================
# STAGE 1 — TERRAFORM PLAN (CI)
# =====================================================
- stage: Terraform_Plan
  displayName: "Terraform Plan"
  jobs:
  - job: Plan
    displayName: "Run Terraform Plan"
    steps:

    # Install Terraform
    - script: |
        wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform_1.5.7_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform -version
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform init

    # Terraform Validate
    - task: AzureCLI@2
      displayName: "Terraform Validate"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform validate

    # Terraform Plan
    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform plan -out=tfplan

    # Publish plan artifact
    - task: PublishPipelineArtifact@1
      displayName: "Publish tfplan"
      inputs:
        targetPath: '$(workingDirectory)/tfplan'
        artifact: 'tfplan'

# =====================================================
# STAGE 2 — TERRAFORM APPLY (CD)
# =====================================================
- stage: Terraform_Apply
  displayName: "Terraform Apply"
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: "Run Terraform Apply"
    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    # Download plan artifact
    - task: DownloadPipelineArtifact@2
      displayName: "Download tfplan"
      inputs:
        artifact: tfplan
        path: $(workingDirectory)

    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform init

    # Terraform Apply
    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform apply -auto-approve tfplan
