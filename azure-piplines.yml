trigger:
- main

pr:
- main

variables:
  terraformVersion: '1.6.6'
  workingDirectory: 'terraform'
  serviceConnection: 'azure-conn-terraform'   # your service connection name

pool:
  vmImage: 'ubuntu-latest'

stages:


# =====================================================
# STAGE 1 — TERRAFORM PLAN (CI)
# =====================================================
- stage: Terraform_Plan
  displayName: "Terraform Plan"
  jobs:
  - job: Plan
    displayName: "Run Terraform Plan"
    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)
      
    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform init
      env:
        ARM_CLIENT_ID: $(servicePrincipalId)
        ARM_CLIENT_SECRET: $(servicePrincipalKey)
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_TENANT_ID: $(tenantId)

    # Terraform Validate
    - task: AzureCLI@2
      displayName: "Terraform Validate"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform validate
      env:
        ARM_CLIENT_ID: $(servicePrincipalId)
        ARM_CLIENT_SECRET: $(servicePrincipalKey)
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_TENANT_ID: $(tenantId)

    # Terraform Plan
    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform plan -out=tfplan
      env:
        ARM_CLIENT_ID: $(servicePrincipalId)
        ARM_CLIENT_SECRET: $(servicePrincipalKey)
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_TENANT_ID: $(tenantId)

    # Terraform Apply
    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform apply -auto-approve tfplan
      env:
        ARM_CLIENT_ID: $(servicePrincipalId)
        ARM_CLIENT_SECRET: $(servicePrincipalKey)
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_TENANT_ID: $(tenantId)

    # Publish plan artifact
    - task: PublishPipelineArtifact@1
      displayName: "Publish tfplan"
      inputs:
        targetPath: '$(workingDirectory)/tfplan'
        artifact: 'tfplan'

# =====================================================
# STAGE 2 — TERRAFORM APPLY (CD)
# =====================================================
- stage: Terraform_Apply
  displayName: "Terraform Apply"
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: "Run Terraform Apply"
    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    # Download plan artifact
    - task: DownloadPipelineArtifact@2
      displayName: "Download tfplan"
      inputs:
        artifact: tfplan
        path: $(workingDirectory)

    # Terraform Init
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform init

    # Terraform Apply
    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |
          terraform apply -auto-approve tfplan
